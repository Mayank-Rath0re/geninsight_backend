services:
  sql_server:
    build:
      context: ./sql # Path to the folder containing your SQL Dockerfile
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: sql_server_container
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_DB: "genbi_db"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "SA", "-P", "YourStrong@Passw0rd", "-C", "-Q", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fastapi_container
    ports:
      - "8000:8000"
    # Inject the .env file variables into the container at runtime
    env_file:
      - ./api/.env
    volumes:
      - ./api:/app
    restart: unless-stopped
    depends_on:
      sql_server:
        condition: service_healthy

volumes:
  sql_data:
